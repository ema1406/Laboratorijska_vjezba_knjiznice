<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pregled i filtriranje podataka o knjižnicama, odjelima i zaposlenicima."
    />
    <meta name="author" content="Ema Pavić" />
    <title>Pregled podataka - Knjižnice</title>
    <style>
      body {
        font-family: "Calibri", Arial, sans-serif;
        max-width: auto;
        padding: 25px;
        background-color: #e6f2ff;
        color: #2c3e50;
      }

      nav {
        margin-bottom: 20px;
        padding: 12px 15px;
        background-color: #85c2ff;
        border-radius: 6px;
      }

      .nav-links {
        display: flex;
        gap: 15px;
        font-weight: bold;
      }

      .nav-links a {
        text-decoration: none;
        color: #1a365d;
        padding: 5px 10px;
        border-radius: 4px;
      }

      .nav-links a:hover {
        background-color: rgba(255, 255, 255, 0.4);
      }

      h1 {
        color: #1a365d;
        margin-top: 0;
      }

      .filter-section {
        margin-bottom: 20px;
        padding: 15px;
        background-color: #ffffff;
        border-radius: 6px;
        border: 1px solid #cfe2ff;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .filter-section label {
        font-weight: bold;
        color: #1a365d;
      }

      input,
      select {
        padding: 8px 12px;
        width: 220px;
        border: 1px solid #bce1ff;
        border-radius: 4px;
        background-color: #fafbfc;
      }

      button {
        padding: 8px 15px;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
      }

      .btn-pretrazi {
        background-color: #1a365d;
        color: white;
      }
      .btn-pretrazi:hover {
        background-color: #2c5282;
      }

      .btn-csv {
        background-color: #bf59df;
        color: white;
      }
      .btn-csv:hover {
        background-color: #783581;
      }

      .btn-json {
        background-color: #e851c5;
        color: white;
      }
      .btn-json:hover {
        background-color: #982b6d;
      }

      .export-section {
        margin-top: 10px;
        display: flex;
        gap: 10px;
        width: 100%;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        background-color: #ffffff;
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid #cfe2ff;
      }

      th,
      td {
        border: 1px solid #e2e8f0;
        padding: 10px 12px;
        text-align: left;
        font-size: 14px;
      }

      th {
        background-color: #d0e5ff;
        color: #1a365d;
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="nav-links">
        <a href="index.html">Početna</a>
        <a href="datatable.html">Pregled podataka</a>
      </div>
    </nav>

    <h1>Tablični pregled knjižnica</h1>

    <div class="filter-section">
      <label for="searchInput">Pretraži:</label>
      <input
        type="text"
        id="searchInput"
        placeholder="Upišite pojam za pretragu..."
      />

      <label for="filterAttr">Atribut:</label>
      <select id="filterAttr">
        <option value="sve">Svi atributi (Wildcard)</option>
        <option value="naziv">Naziv knjižnice</option>
        <option value="grad">Grad</option>
        <option value="vrsta_knjiznice">Vrsta knjižnice</option>
        <option value="odjel_naziv">Naziv odjela</option>
        <option value="ime">Ime zaposlenika</option>
        <option value="prezime">Prezime zaposlenika</option>
      </select>

      <button type="button" class="btn-pretrazi" onclick="filtrirajIspis()">
        Pretraži
      </button>

      <div class="export-section">
        <button type="button" class="btn-csv" onclick="preuzmiCSV()">
          Preuzmi CSV
        </button>
        <button type="button" class="btn-json" onclick="preuzmiJSON()">
          Preuzmi JSON
        </button>
      </div>
    </div>

    <table id="knjizniceTable">
      <thead>
        <tr>
          <th>Naziv</th>
          <th>Adresa</th>
          <th>Poštanski broj</th>
          <th>Grad</th>
          <th>Županija</th>
          <th>Telefon</th>
          <th>Mail</th>
          <th>Web</th>
          <th>Vrsta knjižnice</th>
          <th>Odjel naziv</th>
          <th>Ime</th>
          <th>Prezime</th>
          <th>Radni odnos</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script>
      let sviPodaci = [];
      let trenutnoPrikazaniPodaci = [];

      async function dohvatiPodatkeIzBaze() {
        try {
          const odgovor = await fetch("/api/knjiznice");
          sviPodaci = await odgovor.json();
          trenutnoPrikazaniPodaci = sviPodaci;
          prikaziPodatke(trenutnoPrikazaniPodaci);
        } catch (greska) {
          console.error("Greška pri dohvaćanju podataka:", greska);
        }
      }

      function prikaziPodatke(podaciZaPrikaz) {
        const tbody = document.querySelector("#knjizniceTable tbody");
        tbody.innerHTML = "";

        if (podaciZaPrikaz.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="13" style="text-align:center;">Nema pronađenih podataka</td></tr>';
          return;
        }

        podaciZaPrikaz.forEach((item) => {
          const red = `<tr>
                    <td>${item.naziv || ""}</td>
                    <td>${item.adresa || ""}</td>
                    <td>${item.postanski_broj || ""}</td>
                    <td>${item.grad || ""}</td>
                    <td>${item.zupanija || ""}</td>
                    <td>${item.telefon || ""}</td>
                    <td>${item.mail || ""}</td>
                    <td>${item.web || ""}</td>
                    <td>${item.vrsta_knjiznice || ""}</td>
                    <td>${item.odjel_naziv || ""}</td>
                    <td>${item.ime || ""}</td>
                    <td>${item.prezime || ""}</td>
                    <td>${item.radni_odnos || ""}</td>
                </tr>`;
          tbody.innerHTML += red;
        });
      }

      function filtrirajIspis() {
        const pojam = document
          .getElementById("searchInput")
          .value.toLowerCase()
          .trim();
        const atribut = document.getElementById("filterAttr").value;

        trenutnoPrikazaniPodaci = sviPodaci.filter((item) => {
          if (pojam === "" || pojam === "sve") return true;
          if (atribut === "sve") {
            return Object.values(item).some(
              (vrijednost) =>
                vrijednost &&
                vrijednost.toString().toLowerCase().includes(pojam),
            );
          } else {
            const vrijednostPolja = item[atribut];
            return (
              vrijednostPolja &&
              vrijednostPolja.toString().toLowerCase().includes(pojam)
            );
          }
        });

        prikaziPodatke(trenutnoPrikazaniPodaci);
      }

      function preuzmiCSV() {
        if (trenutnoPrikazaniPodaci.length === 0) {
          alert("Nema podataka za preuzimanje.");
          return;
        }

        const kljucevi = Object.keys(trenutnoPrikazaniPodaci[0]);
        let csvSadrzaj = kljucevi.join(",") + "\n";

        trenutnoPrikazaniPodaci.forEach((item) => {
          let red = kljucevi
            .map((kljuc) => {
              let vrijednost = item[kljuc] ? item[kljuc].toString() : "";
              vrijednost = `"${vrijednost.replace(/"/g, '""')}"`;
              return vrijednost;
            })
            .join(",");

          csvSadrzaj += red + "\n";
        });

        const encodedUri = encodeURI(
          "data:text/csv;charset=utf-8," + csvSadrzaj,
        );
        const downloadAnchor = document.createElement("a");
        downloadAnchor.setAttribute("href", encodedUri);
        downloadAnchor.setAttribute("download", "knjiznice_filtrirano.csv");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      }

      function preuzmiJSON() {
        if (trenutnoPrikazaniPodaci.length === 0) {
          alert("Nema podataka za preuzimanje.");
          return;
        }

        const mapKnjiznice = {};

        trenutnoPrikazaniPodaci.forEach((row) => {
          const nazivKnjiznice = row.naziv;

          if (!mapKnjiznice[nazivKnjiznice]) {
            mapKnjiznice[nazivKnjiznice] = {
              naziv: row.naziv || "",
              adresa: row.adresa || "",
              postanski_broj: row.postanski_broj || "",
              grad: row.grad || "",
              zupanija: row.zupanija || "",
              telefon: row.telefon || "",
              mail: row.mail || "",
              web: row.web || "",
              vrsta_knjiznice: row.vrsta_knjiznice || "",
              odjeli: [],
              zaposlenici: [],
            };
          }

          if (row.odjel_naziv) {
            mapKnjiznice[nazivKnjiznice].odjeli.push({
              odjel_naziv: row.odjel_naziv,
            });
          }

          if (row.ime || row.prezime) {
            mapKnjiznice[nazivKnjiznice].zaposlenici.push({
              ime: row.ime || "",
              prezime: row.prezime || "",
              radni_odnos: row.radni_odnos || "",
            });
          }
        });

        const ugnijezdeniPodaci = Object.values(mapKnjiznice);

        const dataStr =
          "data:text/json;charset=utf-8," +
          encodeURIComponent(JSON.stringify(ugnijezdeniPodaci, null, 2));
        const downloadAnchor = document.createElement("a");
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "knjiznice_filtrirano.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      }

      window.onload = dohvatiPodatkeIzBaze;
    </script>
  </body>
</html>
